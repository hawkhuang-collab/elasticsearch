    - [30]

---
normalizer applies to doc values like an ordinary field:
- do:
    indices.create:
      index: nr_normalizer
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
          analysis:
            normalizer:
              lowercase_norm:
                type: custom
                filter:
                - lowercase
        mappings:
          properties:
            items:
              type: nested
              properties:
                sku:
                  type: keyword
                  normalizer: lowercase_norm
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_normalizer
          _id: "1"
      - items:
        - sku: BOOK
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_normalizer | EVAL hit = NESTED_ANY(items.sku == "book") | KEEP hit | LIMIT 10
- match:
    values:
    - [true]

---
synthetic source reads doc values after a coordinator limit and expansion:
- do:
    indices.create:
      index: nr_synthetic
      body:
        settings:
          index.mapping.source.mode: synthetic
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_synthetic
          _id: "1"
      - id: "1"
        items:
        - price: 10
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_synthetic | LIMIT 1 | MV_EXPAND id | EVAL total = NESTED(SUM(items.price)) | KEEP total
- match:
    values:
    - [10]

---
synthetic source sums doc values after a sort and limit:
- do:
    indices.create:
      index: nr_synthetic
      body:
        settings:
          index.mapping.source.mode: synthetic
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_synthetic
          _id: "1"
      - id: "1"
        items:
        - price: 10
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_synthetic | SORT id | LIMIT 1 | EVAL total = NESTED(SUM(items.price)) | KEEP total
- match:
    values:
    - [10]

---
child mapping options read like the same options on a top-level field:
# Each parent has one child holding the same values as its top-level twins, so every child column must match its twin:
# scaled_float rounds, null_value replaces an explicit null, an alias reads its target, a multi-field reads its parent's
# value, a value over ignore_above reads null, and copy_to fills the target.
- do:
    indices.create:
      index: nr_mapping_options
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            t_scaled:
              type: scaled_float
              scaling_factor: 100
            t_cost:
              type: alias
              path: t_scaled
            t_sku:
              type: keyword
              null_value: none
            t_short:
              type: keyword
              ignore_above: 3
            t_note:
              type: text
              fields:
                raw:
                  type: keyword
            t_a:
              type: keyword
              copy_to: t_all
            t_all:
              type: keyword
            items:
              type: nested
              properties:
                scaled:
                  type: scaled_float
                  scaling_factor: 100
                cost:
                  type: alias
                  path: items.scaled
                sku:
                  type: keyword
                  null_value: none
                short:
                  type: keyword
                  ignore_above: 3
                note:
                  type: text
                  fields:
                    raw:
                      type: keyword
                a:
                  type: keyword
                  copy_to: items.all
                all:
                  type: keyword
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_mapping_options
      - id: "1"
        t_scaled: 1.234
        t_sku: null
        t_short: toolong
        t_note: Red Car
        t_a: x
        items:
        - { scaled: 1.234, sku: null, short: toolong, note: Red Car, a: x }
      - index:
          _index: nr_mapping_options
      - id: "2"
        t_scaled: 5
        t_sku: s2
        t_short: ok
        t_note: Blue
        t_a: y
        items:
        - { scaled: 5, sku: s2, short: ok, note: Blue, a: y }
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: |
          FROM nr_mapping_options
          | NESTED_EXPAND items
          | KEEP id, items.scaled, t_scaled, items.cost, t_cost, items.sku, t_sku, items.short, t_short, items.note.raw, t_note.raw, items.all, t_all
          | SORT id
          | LIMIT 10
- match:
    values:
    - ["1", 1.23, 1.23, 1.23, 1.23, none, none, null, null, Red Car, Red Car, x, x]
    - ["2", 5.0, 5.0, 5.0, 5.0, s2, s2, ok, ok, Blue, Blue, y, y]
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: |
          FROM nr_mapping_options
          | EVAL cost = NESTED(SUM(items.cost)), none = NESTED_ANY(items.sku == "none"), short = NESTED_ANY(items.short == "ok"), copied = NESTED_ANY(items.all == "x")
          | KEEP id, cost, none, short, copied
          | SORT id
          | LIMIT 10
- match:
    values:
    - ["1", 1.23, true, false, true]
    - ["2", 5.0, false, true, false]
