---
synthetic source reads doc values on the data node:
- do:
    indices.create:
      index: nr_synthetic
      body:
        settings:
          index.mapping.source.mode: synthetic
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_synthetic
          _id: "1"
      - items:
        - price: 10
        - price: 20
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_synthetic | EVAL total = NESTED(SUM(items.price)) | KEEP total | LIMIT 10
- match:
    values:
    - [30]

---
disabled source reads doc values on the data node:
- do:
    indices.create:
      index: nr_disabled_source
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          _source:
            enabled: false
          properties:
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_disabled_source
          _id: "1"
      - items:
        - price: 10
        - price: 20
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_disabled_source | EVAL total = NESTED(SUM(items.price)) | KEEP total | LIMIT 10
