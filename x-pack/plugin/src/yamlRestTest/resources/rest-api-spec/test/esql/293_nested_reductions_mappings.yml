# Child fields read as ordinary fields of the same mapping would: from doc values, or from the child's object in the
# parent's stored source when the field has none. Source mode and normalizers apply as they do to a top-level field.
# Execute with -Desql.nested_reductions.test_execution=true. A capability skip is not a pass.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - contains
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Completed per-parent nested reductions; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"

---
explicit coerce true matches a plain long sum:
- do:
    indices.create:
      index: nr_coerce_default
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            items:
              type: nested
              properties:
                price:
                  type: long
                  coerce: true
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_coerce_default
          _id: "1"
      - items:
        - price: 10
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_coerce_default | EVAL total = NESTED(SUM(items.price)) | KEEP total | LIMIT 10
- match: { columns.0.name: total }
- match: { columns.0.type: long }
- length: { values: 1 }
- match: { values.0.0: 10 }

---
explicit ignore_malformed false matches a plain long sum:
- do:
    indices.create:
      index: nr_ignore_malformed_default
