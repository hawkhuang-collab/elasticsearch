---
text and keyword children in a columnar index:
# Columnar indices keep doc values on every field and rebuild _source from them; vectors are patched back in.
- requires:
    test_runner_features: [ capabilities ]
    capabilities:
    - method: PUT
      path: /{index}
      capabilities: [ columnar_index_modes ]
    reason: "columnar index modes are required"
- do:
    indices.create:
      index: nsc_columnar_index
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
          index.mode: columnar
          index.mapping.source.mode: columnar_stored
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            embedding:
              type: dense_vector
              dims: 3
            items:
              type: nested
              properties:
                price:
                  type: long
                note:
                  type: text
                sku:
                  type: keyword
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nsc_columnar_index
      - id: a
        embedding: [1.0, 2.0, 3.0]
        items:
        - { price: 1, note: red, sku: r1 }
        - { price: 2 }
        - { price: 3, note: blue, sku: b3 }
      - index:
          _index: nsc_columnar_index
      - id: b
        embedding: [4.0, 5.0, 6.0]
        items:
        - { price: 4, note: green, sku: g4 }
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nsc_columnar_index | NESTED_EXPAND items | KEEP id, items.price, items.note, items.sku | SORT id, items.price | LIMIT 10
- match:
    values:
    - [a, 1, red, r1]
    - [a, 2, null, null]
    - [a, 3, blue, b3]
    - [b, 4, green, g4]
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: |
          FROM nsc_columnar_index
          | EVAL notes = NESTED(COUNT(items.note)), blue = NESTED_ANY(items.note == "blue" AND items.sku == "b3")
          | KEEP id, notes, blue
          | SORT id
          | LIMIT 10
- match:
    values:
    - [a, 2, true]
    - [b, 1, false]
