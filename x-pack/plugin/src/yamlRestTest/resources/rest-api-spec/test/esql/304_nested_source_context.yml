# A child field without doc values reads its value from source, as a top-level field does. Each child must read its own
# object, whatever builds the parent's source: stored _source, stored _source with vectors patched back in, synthetic
# source, or the columnar_stored source of a columnar index.
# Execute with -Desql.nested_reductions.test_execution=true. A capability skip is not a pass.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Completed per-parent nested reductions; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"

---
keyword child without doc values under stored source:
- do:
    indices.create:
      index: nsc_stored
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                price:
                  type: long
                sku:
                  type: keyword
                  doc_values: false
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nsc_stored
      - id: a
        items:
        - { price: 1, sku: red }
        - { price: 2 }
        - { price: 3, sku: blue }
      - index:
          _index: nsc_stored
      - id: b
        items:
        - { price: 4, sku: green }
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nsc_stored | NESTED_EXPAND items | KEEP id, items.price, items.sku | SORT id, items.price | LIMIT 10
- match:
    values:
    - [a, 1, red]
    - [a, 2, null]
    - [a, 3, blue]
    - [b, 4, green]

---
text child beside a vector whose source is patched back in:
# New indices leave dense vectors out of the stored _source and rebuild them on read, so the source loader is not a plain
# stored one even though _source is stored.
- do:
    indices.create:
      index: nsc_vectors
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
          index.mapping.exclude_source_vectors: true
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            embedding:
              type: dense_vector
              dims: 3
            items:
              type: nested
              properties:
                price:
                  type: long
                note:
                  type: text
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nsc_vectors
      - id: a
        embedding: [1.0, 2.0, 3.0]
        items:
        - { price: 1, note: red }
        - { price: 2 }
        - { price: 3, note: blue }
      - index:
          _index: nsc_vectors
      - id: b
        embedding: [4.0, 5.0, 6.0]
        items:
        - { price: 4, note: green }
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nsc_vectors | NESTED_EXPAND items | KEEP id, items.price, items.note | SORT id, items.price | LIMIT 10
- match:
    values:
    - [a, 1, red]
    - [a, 2, null]
    - [a, 3, blue]
    - [b, 4, green]
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: |
          FROM nsc_vectors
          | EVAL notes = NESTED(COUNT(items.note)), blue = NESTED_ANY(items.note == "blue" AND items.price == 3)
          | KEEP id, notes, blue
          | SORT id
          | LIMIT 10
- match:
    values:
    - [a, 2, true]
    - [b, 1, false]

