# NESTED_ANY needs one Boolean per object: a multivalued result is rejected wherever it appears, even after a match.
# Execute with -Desql.nested_reductions.test_execution=true. A capability skip is not a pass.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - contains
    - warnings
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Completed per-parent nested reductions; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"
- do:
    indices.create:
      index: nr_nested_existence
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings: {"dynamic": "strict", "properties": {"id": {"type": "keyword"}, "items": {"type": "nested", "properties": {"active": {"type": "boolean"}}}}}
- do:
    bulk:
      refresh: true
      body:
      - {"index": {"_index": "nr_nested_existence", "_id": "late_mv"}}
      - {"id": "late_mv", "items": [{"active": true}, {"active": [true, false]}]}
      - {"index": {"_index": "nr_nested_existence", "_id": "early_mv"}}
      - {"id": "early_mv", "items": [{"active": [true, false]}, {"active": true}]}
      - {"index": {"_index": "nr_nested_existence", "_id": "mv_only"}}
      - {"id": "mv_only", "items": [{"active": [true, false]}]}
      - {"index": {"_index": "nr_nested_existence", "_id": "no_true"}}
      - {"id": "no_true", "items": [{"active": false}, {"active": null}]}
      - {"index": {"_index": "nr_nested_existence", "_id": "all_unknown"}}
      - {"id": "all_unknown", "items": [{"active": null}, {}]}
      - {"index": {"_index": "nr_nested_existence", "_id": "empty"}}
      - {"id": "empty", "items": []}
      - {"index": {"_index": "nr_nested_existence", "_id": "valid"}}
      - {"id": "valid", "items": [{"active": false}, {"active": true}, {"active": null}]}

---
"raw multivalue rejected: late_mv":
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_existence | WHERE id == "late_mv" | EVAL picked = NESTED_ANY(items.active) | KEEP id, picked | LIMIT 10'
- contains:
    error.reason: "scalar predicate result"

---
"raw multivalue rejected: early_mv":
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
