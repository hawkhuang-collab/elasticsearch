- match:
    values:
    - ["mv_only", true]

---
scalar comparison after true child:
- do:
    warnings:
    - "Line 1:77: evaluation of [items.active == true] failed, treating result as null. Only first 20 failures recorded."
    - "Line 1:77: java.lang.IllegalArgumentException: single-value function encountered multi-value"
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_existence | WHERE id == "late_mv" | EVAL picked = NESTED_ANY(items.active == true) | KEEP id, picked | LIMIT 10'
- match:
    columns.1.type: boolean
- match:
    values:
    - ["late_mv", true]

---
comparison is not multivalue membership:
- do:
    warnings:
    - "Line 1:77: evaluation of [items.active == true] failed, treating result as null. Only first 20 failures recorded."
    - "Line 1:77: java.lang.IllegalArgumentException: single-value function encountered multi-value"
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_existence | WHERE id == "mv_only" | EVAL picked = NESTED_ANY(items.active == true) | KEEP id, picked | LIMIT 10'
- match:
    columns.1.type: boolean
- match:
    values:
    - ["mv_only", false]

