---
"raw multivalue rejected: mv_only":
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_existence | WHERE id == "mv_only" | EVAL picked = NESTED_ANY(items.active) | KEEP id, picked | LIMIT 10'
- contains:
    error.reason: "scalar predicate result"

---
"explicit scalar reduction: late_mv":
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_existence | WHERE id == "late_mv" | EVAL picked = NESTED_ANY(MV_MAX(items.active)) | KEEP id, picked | LIMIT 10'
- match:
    columns.1.type: boolean
- match:
    values:
    - ["late_mv", true]

---
"explicit scalar reduction: early_mv":
- do:
