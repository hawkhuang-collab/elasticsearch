setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [fn_nested]
      reason: "NESTED is snapshot-only"
  - do:
      indices.create:
        index: nested_shapes
        body:
          settings:
            number_of_shards: 3
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                dynamic: false
                properties:
                  qty:
                    type: long
  - do:
      indices.create:
        index: nested_shapes_lookup
        body:
          settings:
            number_of_shards: 1
            index.mode: lookup
          mappings:
            properties:
              id:
                type: keyword
              tag:
                type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_shapes_lookup", "_id": "1" } }
          - { "id": "2", "tag": "two" }
          - { "index": { "_index": "nested_shapes_lookup", "_id": "2" } }
          - { "id": "5", "tag": "five" }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_shapes", "_id": "1" } }
          - { "id": "1", "items": [ { "qty": [ 1, 2 ], "extra": 7 }, { "extra": 9 } ] }
          - { "index": { "_index": "nested_shapes", "_id": "2" } }
          - { "id": "2", "items": [ { "qty": 5 } ] }
          - { "index": { "_index": "nested_shapes", "_id": "3" } }
          - { "id": "3" }
          - { "index": { "_index": "nested_shapes", "_id": "4" } }
          - { "id": "4", "items": [ { "extra": 1 } ] }
          - { "index": { "_index": "nested_shapes", "_id": "5" } }
          - { "id": "5", "items": [ { "qty": 10 }, { "qty": 20 }, { "qty": 30 } ] }
          - { "index": { "_index": "nested_shapes", "_id": "6" } }
          - { "id": "6", "items": [] }

---
"NESTED reduces across shards, multivalued children and children without a value":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_shapes | EVAL s = NESTED(SUM(items.qty)), c = NESTED(COUNT(items.qty)), n = NESTED(items, COUNT(*)), mn = NESTED(MIN(items.qty)), mx = NESTED(MAX(items.qty)), a = NESTED(AVG(items.qty)) | KEEP id, s, c, n, mn, mx, a | SORT id'
  - length: { values: 6 }
  - match: { values.0: ["1", 3, 2, 2, 1, 2, 1.5] }
  - match: { values.1: ["2", 5, 1, 1, 5, 5, 5.0] }
  - match: { values.2: ["3", null, 0, 0, null, null, null] }
  - match: { values.3: ["4", null, 0, 1, null, null, null] }
  - match: { values.4: ["5", 60, 3, 3, 10, 30, 20.0] }
  - match: { values.5: ["6", null, 0, 0, null, null, null] }

---
"NESTED filters parents by their reduction":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_shapes | WHERE NESTED(SUM(items.qty)) > 4 | KEEP id | SORT id'
  - length: { values: 2 }
  - match: { values.0: ["2"] }
  - match: { values.1: ["5"] }

---
"NESTED reads the parent after the parent columns are dropped":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_shapes | KEEP id | EVAL s = NESTED(SUM(items.qty)) | DROP id | SORT s DESC NULLS LAST | LIMIT 2'
  - match: { values.0: [60] }
  - match: { values.1: [5] }

---
"NESTED does not read an unmapped name under a nested path":
  - do:
      catch: /Field \[items.extra\] is outside the nested scope/
      esql.query:
        body:
          query: 'FROM nested_shapes | EVAL t = NESTED(SUM(items.extra)) | KEEP id, t'

---
"NESTED cannot follow a LIMIT":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM nested_shapes | SORT id | LIMIT 3 | EVAL s = NESTED(SUM(items.qty)) | KEEP id, s'

---
"NESTED cannot follow a plain LIMIT":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM nested_shapes | LIMIT 3 | EVAL s = NESTED(SUM(items.qty)) | KEEP id, s'

---
"NESTED cannot follow INLINE STATS":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM nested_shapes | INLINE STATS c = COUNT(*) BY id | EVAL s = NESTED(SUM(items.qty)) | KEEP id, s'

---
"NESTED after MV_EXPAND repeats each parent's reduction on each row":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_shapes | WHERE id == "5" | EVAL m = [1, 2] | MV_EXPAND m | EVAL s = NESTED(SUM(items.qty)) | KEEP id, m, s | SORT m'
  - length: { values: 2 }
  - match: { values.0: ["5", 1, 60] }
  - match: { values.1: ["5", 2, 60] }

---
"NESTED after a LOOKUP JOIN reads the nested documents of the driving index":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_shapes | LOOKUP JOIN nested_shapes_lookup ON id | EVAL s = NESTED(SUM(items.qty)) | KEEP id, tag, s | SORT id'
  - length: { values: 6 }
  - match: { values.1: ["2", "two", 5] }
  - match: { values.4: ["5", "five", 60] }
  - match: { values.0: ["1", null, 3] }
