---
multivalued return rejected:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_selection | WHERE id == "mv_value" | EVAL picked = NESTED(LAST(items.sku, items.rank)) | KEEP id, picked | LIMIT 10'
- contains:
    error.reason: "scalar child values"

---
multivalued key rejected:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_selection | WHERE id == "mv_rank" | EVAL picked = NESTED(LAST(items.sku, items.rank)) | KEEP id, picked | LIMIT 10'
- contains:
