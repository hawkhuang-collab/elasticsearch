      allow_partial_results: false
      body:
        query: 'FROM nr_nested_selection | WHERE id == "mv_rank" | EVAL picked = NESTED(LAST(items.sku, MV_MAX(items.rank))) | KEEP id, picked | LIMIT 10'
- match:
    columns.1.type: keyword
- match:
