---
null value at maximum key:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_selection | WHERE id == "null_value" | EVAL picked = NESTED(LAST(items.sku, items.rank)) | KEEP id, picked | LIMIT 10'
- match:
    columns.1.type: keyword
- match:
    values:
    - ["null_value", null]

---
all null keys:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_selection | WHERE id == "null_keys" | EVAL picked = NESTED(LAST(items.sku, items.rank)) | KEEP id, picked | LIMIT 10'
- match:
    columns.1.type: keyword
- match:
    values.0.0: "null_keys"
- match:
    values.0.1: '/^(a|b)$/'

