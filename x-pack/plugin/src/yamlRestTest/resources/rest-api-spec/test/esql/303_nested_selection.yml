- do:
    esql.query:
      allow_partial_results: false
      body:
        query: 'FROM nr_nested_selection | WHERE id == "regular" | EVAL picked = NESTED(LAST(items.active, items.rank)) | KEEP id, picked | LIMIT 10'
- match:
    columns.1.type: boolean
- match:
    values:
    - ["regular", true]

