setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [fn_nested_object, fn_nested, fn_nested_any, nested_expand]
      reason: "NESTED_OBJECT is snapshot-only"
  - do:
      indices.create:
        index: no_orders
        body:
          settings:
            number_of_shards: 1
          mappings:
            dynamic: strict
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  price:
                    type: long
                  sku:
                    type: keyword
              shipments:
                type: nested
                properties:
                  carrier:
                    type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "no_orders", "_id": "a" } }
          - { "id": "a", "items": [ { "price": 20, "sku": "book" }, { "price": 5, "sku": "pen" } ], "shipments": [ { "carrier": "ups" } ] }
          - { "index": { "_index": "no_orders", "_id": "b" } }
          - { "id": "b", "items": [] }
          - { "index": { "_index": "no_orders", "_id": "c" } }
          - { "id": "c" }
          - { "index": { "_index": "no_orders", "_id": "d" } }
          - { "id": "d", "items": [ {} ] }
          - { "index": { "_index": "no_orders", "_id": "e" } }
          - { "id": "e", "items": [ { "price": 1, "sku": "cup" } ] }

---
"Reductions and predicates read through a reference":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | EVAL total = NESTED(SUM(o.price)), n = NESTED(COUNT(o.price)), has = NESTED_ANY(o, true) | KEEP id, total, n, has | SORT id'
  - length: { values: 5 }
  - match: { values.0: ["a", 25, 2, true] }
  - match: { values.1: ["b", null, 0, false] }
  - match: { values.2: ["c", null, 0, false] }
  - match: { values.3: ["d", null, 0, true] }
  - match: { values.4: ["e", 1, 1, true] }

---
"A predicate through a reference filters parents":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | WHERE NESTED_ANY(o.sku == "pen") OR NESTED_ANY(o.price < 2) | KEEP id | SORT id'
  - length: { values: 2 }
  - match: { values.0: ["a"] }
  - match: { values.1: ["e"] }

---
"Expanding a reference names the columns after it":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | NESTED_EXPAND o | KEEP id, o.price, o.sku | SORT id, o.price'
  - match: { columns.0.name: id }
  - match: { columns.1.name: o.price }
  - match: { columns.1.type: long }
  - match: { columns.2.name: o.sku }
  - match: { columns.2.type: keyword }
  - length: { values: 6 }
  - match: { values.0: ["a", 5, "pen"] }
  - match: { values.1: ["a", 20, "book"] }
  - match: { values.2: ["b", null, null] }
  - match: { values.3: ["c", null, null] }
  - match: { values.4: ["d", null, null] }
  - match: { values.5: ["e", 1, "cup"] }

---
"A renamed reference":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | RENAME o AS p | EVAL n = NESTED(COUNT(p.price)) | KEEP id, n | SORT id'
  - match: { values.0: ["a", 2] }
  - match: { values.1: ["b", 0] }

---
"A reference is not a returned column":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | KEEP id, o | SORT id'
  - length: { columns: 1 }
  - match: { columns.0.name: id }
  - length: { values: 5 }
  - match: { values.0: ["a"] }

---
"A reference is not a returned column of a wildcard":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | KEEP * | SORT id'
  - length: { columns: 1 }
  - match: { columns.0.name: id }

---
"A reference is not a value":
  - do:
      catch: /\[o\] is a reference to the nested collection \[items\]/
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | WHERE o IS NOT NULL'
  - do:
      catch: /\[o\] is a reference to the nested collection \[items\]/
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | STATS c = COUNT(*) BY o'

---
"The argument must be a nested collection":
  - do:
      catch: /NESTED_OBJECT requires a nested collection, not \[items.price\]/
      esql.query:
        body:
          query: 'FROM no_orders | EVAL x = NESTED_OBJECT(items.price)'
  - do:
      catch: /NESTED_OBJECT requires a nested collection, not \[id\]/
      esql.query:
        body:
          query: 'FROM no_orders | EVAL x = NESTED_OBJECT(id)'

---
"A reference is only supported in EVAL":
  - do:
      catch: /NESTED_OBJECT is supported in EVAL/
      esql.query:
        body:
          query: 'FROM no_orders | WHERE NESTED_OBJECT(items) IS NOT NULL'

---
"A reference cannot be named like a nested collection":
  - do:
      catch: '/NESTED_OBJECT cannot be named \[items\]: that name is a nested collection/'
      esql.query:
        body:
          query: 'FROM no_orders | EVAL items = NESTED_OBJECT(shipments)'

---
"A name the mapping does not declare is not in the nested scope of a reference":
  - do:
      catch: /outside the nested scope/
      esql.query:
        body:
          query: 'FROM no_orders | EVAL o = NESTED_OBJECT(items) | EVAL t = NESTED(SUM(o.undeclared))'

---
"Reading through a reference of an index whose stored source is filtered returns null with a warning":
  - do:
      indices.create:
        index: no_filtered
        body:
          settings:
            number_of_shards: 1
          mappings:
            _source:
              excludes: [ "items.skip" ]
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  note:
                    type: text
                  skip:
                    type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "no_filtered", "_id": "1" } }
          - { "id": "1", "items": [ { "skip": "x" }, { "note": "b" } ] }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[\\d+\\]"
        - "Field \\[items.note\\] cannot be retrieved from the filtered _source of index \\[no_filtered\\]; returning null"
      esql.query:
        body:
          query: 'FROM no_filtered | EVAL o = NESTED_OBJECT(items) | NESTED_EXPAND o | KEEP id, o.note, o.skip | SORT o.skip, o.note'
  - length: { values: 2 }
  - match: { values.0: ["1", null, "x"] }
